<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>互动营销灵感库</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e6e6e2;--acc:#ff5a36;--red:#d93025}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:rgba(245,245,242,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:12px 24px 8px;border-bottom:1px solid var(--line);width:100%}
h1{font-size:19px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
h1 small{font-size:12px;color:var(--sub);font-weight:400}
#q{width:100%;min-width:0;flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;min-height:44px}
.search-tools{display:flex;align-items:center;gap:8px}
.filter-select,.filter-trigger{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:13px}
#gameplayFilter{width:206px;flex-shrink:0}
.gameplay-note{font-size:11px;color:var(--sub);margin:7px 0 0;line-height:1.6}
.gameplay-note span{white-space:nowrap}
.dialog-gameplay-note{margin:-9px 0 16px}
.filter-select{max-width:100%;padding:9px 30px 9px 12px;cursor:pointer}
.filter-trigger{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;white-space:nowrap;cursor:pointer;flex-shrink:0}
.filter-trigger svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.filter-count{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;background:var(--ink);color:white;border-radius:999px;font-size:11px}
#mobileFilters{display:none}
.active-filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:8px}
.active-filter{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:6px 10px;border:1px solid #f3d8ca;border-radius:8px;background:#fff3ed;color:#883c24;font:inherit;font-size:12px;cursor:pointer}
.active-filter span{font-size:17px;line-height:1}
.clear-filters{border:0;background:transparent;color:var(--sub);font:inherit;font-size:12px;min-height:36px;padding:6px 10px;cursor:pointer;text-decoration:underline}
.filter-dialog{width:calc(100% - 32px);max-width:480px;max-height:calc(100dvh - 32px);padding:0;border:1px solid var(--line);border-radius:18px;color:var(--ink);background:#fff;overflow:auto;box-shadow:0 16px 60px #0003}
.filter-dialog::backdrop{background:#0006}
.filter-dialog-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0 20px}
.filter-dialog h2{font-size:19px;margin:0}
.filter-close{width:44px;height:44px;border:0;background:transparent;color:var(--sub);font-size:27px;cursor:pointer;border-radius:10px}
.filter-body{padding:4px 20px 20px}
.filter-description{font-size:13px;color:var(--sub);margin:0 0 18px}
.filter-field{display:block;font-size:13px;font-weight:600;margin-bottom:16px}
.filter-field select{display:block;width:100%;margin-top:7px;font-weight:400;font-size:15px}
.filter-check{display:flex;align-items:center;gap:10px;min-height:48px;font-size:14px;cursor:pointer}
.filter-check input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.filter-dialog-actions{position:sticky;bottom:0;display:flex;gap:10px;padding:14px 20px;background:#fff;border-top:1px solid var(--line)}
.filter-dialog-actions button{min-height:44px;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}
.filter-dialog-actions .apply{flex:1;background:var(--ink);color:#fff;border-color:var(--ink)}
body:has(dialog[open]){overflow:hidden}
@media(min-width:600px){.dialog-primary-filters{display:none}}
@media(max-width:599px){.desktop-filter{display:none}#mobileFilters{display:inline-flex}.filter-trigger{padding:9px 11px}.filter-dialog{width:100%;max-width:none;max-height:85dvh;margin:auto 0 0;border-radius:20px 20px 0 0;border-bottom:0}.filter-dialog-actions{padding-bottom:calc(14px + env(safe-area-inset-bottom))}}
.views{display:flex;gap:6px;margin-bottom:9px}
.view{border:0;border-radius:9px;background:transparent;color:var(--sub);padding:8px 11px;font:inherit;font-size:14px;cursor:pointer;min-height:40px}
.view[aria-selected="true"]{background:var(--ink);color:#fff}
.view-count{font-size:12px;margin-left:5px;opacity:.8}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
main{width:100%;max-width:100%;margin:0;padding:16px 24px;display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
@media(max-width:599px){header{padding:12px 12px 8px}main{padding:12px;gap:14px;grid-template-columns:1fr}footer{padding:20px 12px 90px}}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-direction:column;transition:opacity .25s,transform .25s;min-width:0}
.card.gone{opacity:0;transform:scale(.97)}
.imgw{position:relative;aspect-ratio:4/3;background:#e9e9e6;flex-shrink:0;overflow:hidden}
.imgw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mb{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.t{font-size:16px;font-weight:600;line-height:1.4;margin:0}
.case-summary{display:flex;align-items:center;align-self:flex-start;flex-wrap:wrap;gap:4px 6px;max-width:100%;margin:2px 0;padding:5px 8px;border-radius:7px;background:#fff3ed;color:#883c24;font-size:12px;line-height:1.5}
.summary-mechanic{font-weight:600}
.summary-cross{color:#b56c51}
.summary-mechanic,.summary-industry{white-space:nowrap}
.meta{font-size:12.5px;color:var(--sub)}
.why{font-size:14px;margin:0;color:#333}
.acts{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;flex-wrap:nowrap}
.action-group{display:flex;gap:4px;align-items:center;min-width:0}
.action-group--manage{margin-left:auto}
.icon-action{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 44px;width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:10px;background:#fafaf8;color:var(--ink);text-decoration:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.icon-action svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.icon-action.play{background:var(--ink);color:#fff;border-color:var(--ink)}
.icon-action.del{color:var(--red);border-color:#f1c9c4;background:#fff}
.icon-action.fav[aria-pressed="true"]{background:#fff0e9;color:#ad361e;border-color:#f4bea9}
.icon-action.fav[aria-pressed="true"] svg{fill:currentColor}
.icon-action:active{transform:scale(.96)}
.action-tooltip{position:absolute;bottom:calc(100% + 7px);left:0;z-index:2;width:max-content;max-width:210px;padding:5px 8px;border-radius:6px;background:#222;color:#fff;font-size:12px;font-weight:400;line-height:1.45;text-align:left;white-space:normal;pointer-events:none;visibility:hidden;opacity:0;transition:opacity .12s}
.action-group--manage .action-tooltip{left:auto;right:0}
.icon-action:focus-visible .action-tooltip{visibility:visible;opacity:1}
@media(hover:hover){.icon-action:hover{box-shadow:0 0 0 2px var(--line)}.icon-action:hover .action-tooltip{visibility:visible;opacity:1}}
.action-dialog{width:calc(100% - 32px);max-width:420px;max-height:calc(100dvh - 32px);padding:20px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);box-shadow:0 16px 60px #0003;overflow:auto}
.action-dialog::backdrop{background:#0006}
.action-dialog h3{font-size:18px;margin:0 0 8px}
.action-dialog p{font-size:14px;margin:0 0 16px;color:var(--sub);overflow-wrap:anywhere}
.experience-links{display:flex;flex-direction:column;gap:8px}
.experience-links a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;min-height:44px}
.experience-links a:hover{background:var(--bg)}
.experience-links small{display:block;margin-top:2px;color:var(--sub);overflow-wrap:anywhere}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dialog-actions button{min-height:44px;padding:8px 14px;font:inherit;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
.dialog-actions .yes{background:var(--red);color:#fff;border-color:var(--red)}
@media(prefers-reduced-motion:reduce){.icon-action:active{transform:none}.action-tooltip{transition:none}}
#empty{display:none;text-align:center;color:var(--sub);padding:40px 0;grid-column:1/-1}
footer{text-align:center;font-size:12px;color:var(--sub);padding:20px 24px 90px;width:100%}
footer a{color:var(--sub)}
#favoriteHelp{max-width:620px;margin:8px auto 0}
#favoriteStatus{margin-top:4px;min-height:1.55em}
#favoriteRetry{border:0;background:transparent;color:var(--ink);text-decoration:underline;cursor:pointer;padding:5px 8px;font:inherit}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(150%);background:#222;color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;font-size:14px;transition:transform .25s;z-index:30;max-width:92vw}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast button{background:none;border:0;color:#ffb199;font-size:14px;font-weight:600;cursor:pointer;padding:4px 6px}
#sync{position:fixed;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));font-size:12px;background:#fff3cd;color:#7a5b00;border:1px solid #f0dc8a;border-radius:999px;padding:4px 10px;display:none;z-index:20;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal.show{display:flex}
@media(min-width:600px){.modal{align-items:center}}
.sheet{background:#fff;width:100%;max-width:440px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){.sheet{border-radius:16px}}
.sheet h3{margin:0 0 6px;font-size:17px}
.sheet p{margin:0 0 10px;font-size:13px;color:var(--sub)}
.sheet input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:ui-monospace,Menlo,monospace}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.sheet button{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;cursor:pointer}
.sheet button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.sheet button.warn{color:var(--red);margin-right:auto}
#tokErr{color:var(--red);font-size:12.5px;min-height:1em;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>互动营销灵感库 <small id="count"></small></h1>
  <div class="views" role="tablist" aria-label="案例视图">
    <button type="button" class="view" id="allTab" role="tab" aria-selected="true" aria-controls="list">全部案例 <span class="view-count" id="allCount" aria-hidden="true"></span></button>
    <button type="button" class="view" id="favoritesTab" role="tab" aria-label="我喜欢的case" aria-selected="false" aria-controls="list" tabindex="-1">我喜欢的case <span class="view-count" id="favoriteCount" aria-hidden="true"></span></button>
  </div>
  <div class="search-tools">
    <input id="q" type="search" placeholder="搜索品牌 / 关键词" aria-label="搜索品牌 / 关键词" autocomplete="off">
    <select id="gameplayFilter" class="filter-select desktop-filter" aria-label="玩法" aria-describedby="gameplayNote"></select>
    <select id="industryFilter" class="filter-select desktop-filter" aria-label="品牌行业"></select>
    <button id="moreFilters" class="filter-trigger desktop-filter" type="button" aria-haspopup="dialog" aria-controls="filterDialog" aria-expanded="false">更多筛选 <span class="filter-count" hidden></span></button>
    <button id="mobileFilters" class="filter-trigger" type="button" aria-haspopup="dialog" aria-controls="filterDialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg>筛选 <span class="filter-count" hidden></span></button>
  </div>
  <p class="gameplay-note" id="gameplayNote" aria-live="polite">玩法按本库案例数量从高到低排序。</p>
  <div class="active-filters" id="activeFilters" aria-label="已选筛选条件" hidden></div>
</header>
<dialog id="filterDialog" class="filter-dialog" aria-labelledby="filterTitle" aria-describedby="filterDescription">
  <div class="filter-dialog-head"><h2 id="filterTitle">筛选案例</h2><button type="button" id="closeFilters" class="filter-close" aria-label="关闭筛选">×</button></div>
  <div class="filter-body">
    <p id="filterDescription" class="filter-description">组合筛选条件，找到适合参考的案例。</p>
    <div class="dialog-primary-filters">
      <label class="filter-field" for="dialogGameplay">玩法<select id="dialogGameplay" class="filter-select" aria-describedby="dialogGameplayNote"></select></label>
      <p class="gameplay-note dialog-gameplay-note" id="dialogGameplayNote"></p>
      <label class="filter-field" for="dialogIndustry">品牌行业<select id="dialogIndustry" class="filter-select"></select></label>
    </div>
    <label class="filter-check"><input type="checkbox" id="filterMobile">仅手机可玩</label>
    <label class="filter-check"><input type="checkbox" id="filterDemo">有实机演示</label>
  </div>
  <div class="filter-dialog-actions"><button type="button" id="resetFilters">重置</button><button type="button" id="applyFilters" class="apply">查看案例</button></div>
</dialog>
<main id="list" role="tabpanel" aria-labelledby="allTab"><div id="empty">没有匹配的案例</div></main>
<footer><span id="upd"></span> · <a href="#" id="setLink">令牌设置</a>
  <p id="favoriteHelp">收藏先保存在本浏览器；已有 GitHub 授权时自动同步。同步后的收藏随此公开案例库共享。</p>
  <div id="favoriteStatus" role="status" aria-live="polite"></div><button type="button" id="favoriteRetry" hidden>重试收藏同步</button>
</footer>
<div id="sync"></div>
<div id="toast"><span id="toastMsg">已标记为不感兴趣</span><button id="undo">撤销</button></div>
<div class="modal" id="tokModal"><div class="sheet">
  <h3>需要 GitHub 令牌</h3>
  <p>“不感兴趣”会同步到此案例库。请在 GitHub → Settings → Developer settings → Fine-grained tokens 新建令牌：只选 <b>insprationMC</b> 仓库，权限 Contents 设为 Read and write，粘贴到下面（只保存在本机浏览器）。</p>
  <input id="tokIn" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false">
  <div id="tokErr"></div>
  <div class="row"><button class="warn" id="tokClear">清除已保存令牌</button><button id="tokCancel">稍后</button><button class="pri" id="tokSave">保存</button></div>
</div></div>
<dialog id="actionDialog" class="action-dialog" aria-labelledby="actionDialogTitle" aria-describedby="actionDialogDescription"></dialog>
<script src="favorites.js"></script>
<script src="presentation.js"></script>
<script src="filters.js"></script>
<script src="gameplay-trends.js"></script>
<script>
(function(){
"use strict";
var OWNER="Funkja2413", REPO="insprationMC", BRANCH="main", PATH="data/removed.json";
var API="https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+PATH;
var RAW="https://raw.githubusercontent.com/"+OWNER+"/"+REPO+"/"+BRANCH+"/"+PATH;
var K_TOK="inspo-gh-token", K_PEND="inspo-pending-deletes", K_SEEN="inspo-removed-cache";
var UNDO_MS=5000;
var cases=[], remote=new Set(), pending=[], timers={}, flushing=false, favoritesOnly=false;
var gameplayTracker=InspoGameplayTrends.createTracker({storage:{getItem:function(k){return localStorage.getItem(k)},setItem:function(k,v){localStorage.setItem(k,v)}},version:"gameplay-taxonomy-v1"});
var gameplayReady=false,gameplayLoadFailed=false,gameplayCountsKey=null;
var filterState={gameplay:"",industry:"",mobileOnly:false,demoOnly:false}, filterDraft=null;
var filterDialog=document.getElementById("filterDialog"), filterOpener=null;

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k); if(v===null)localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){return null}}
function loadPending(){try{pending=JSON.parse(ls(K_PEND)||"[]")||[]}catch(e){pending=[]} pending.forEach(function(p){p.ready=true})}
function savePending(){ls(K_PEND,JSON.stringify(pending.map(function(p){return {id:p.id,at:p.at}})))}
function token(){return ls(K_TOK)||""}
function hidden(id){return remote.has(id)||pending.some(function(p){return p.id===id})}
function el(tag,cls,txt){var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:""}
function getDemoLabel(c){return c.demo_label||"实机演示"}
function hasGameplayDemo(c){return !!safeUrl(c.demo_url)&&c.demo_type!=="puzzle_source"}

/* Only the presentation of actions changes; persisted case and preference data stay intact. */
var iconPaths={
  gamepad:'<path d="M6 8h12a3 3 0 0 1 3 2.5l1 7a2.5 2.5 0 0 1-4.2 2.1L15 17H9l-2.8 2.6A2.5 2.5 0 0 1 2 17.5l1-7A3 3 0 0 1 6 8Z"/><path d="M6 11v4M4 13h4M15 12h.01M18 14h.01"/>',
  demo:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 8 6 4-6 4Z"/>',
  source:'<path d="M10 13a5 5 0 0 0 7 .5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  favorite:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',
  heartBroken:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/><path d="m12 5.7-2 4.8 4 3-2 3V21"/>'
};
function iconAction(tag,cls,icon,label){
  var control=el(tag,"icon-action "+cls); if(tag==="button")control.type="button";
  control.setAttribute("aria-label",label);
  control.innerHTML='<svg viewBox="0 0 24 24" data-icon="'+icon+'" aria-hidden="true" focusable="false">'+iconPaths[icon]+'</svg>';
  var tip=el("span","action-tooltip",label); tip.setAttribute("aria-hidden","true");control.appendChild(tip);
  return control;
}
function externalLink(control,url){control.href=url;control.target="_blank";control.rel="noopener noreferrer";return control}
function experienceUrls(c){
  var urls=[c.live_url].concat(Array.isArray(c.additional_live_urls)?c.additional_live_urls:[]).map(safeUrl).filter(Boolean);
  return urls.filter(function(url,index){return urls.indexOf(url)===index});
}
var actionDialog=document.getElementById("actionDialog"), actionOpener=null, actionContext=null, actionCloseFocus=null;
function openActionDialog(opener,title,description){
  actionContext={id:opener.closest(".card").dataset.id,selector:opener.classList.contains("play")?".play":".del"};
  actionOpener=opener;opener.setAttribute("aria-expanded","true");actionDialog.replaceChildren();
  var heading=el("h3","",title);heading.id="actionDialogTitle";actionDialog.appendChild(heading);
  var detail=el("p","",description);detail.id="actionDialogDescription";actionDialog.appendChild(detail);
  return actionDialog;
}
function dialogButton(row,label,cls,fn){var button=el("button",cls,label);button.type="button";button.onclick=fn;row.appendChild(button);return button}
function currentActionOpener(){
  if(!actionContext)return null;
  var owner=Array.prototype.find.call(document.querySelectorAll(".card"),function(cardEl){return cardEl.dataset.id===actionContext.id});
  return owner&&owner.querySelector(actionContext.selector);
}
actionDialog.addEventListener("close",function(){
  var opener=currentActionOpener()||actionOpener;
  if(opener)opener.setAttribute("aria-expanded","false");
  var target=actionCloseFocus||(opener&&opener.isConnected?opener:document.getElementById(favoritesOnly?"favoritesTab":"allTab"));
  if(target)target.focus({preventScroll:true});
  actionOpener=actionContext=actionCloseFocus=null;
});
actionDialog.addEventListener("click",function(e){
  if(e.target!==actionDialog)return;var rect=actionDialog.getBoundingClientRect();
  if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)actionDialog.close();
});
function showExperiences(c,urls,opener){
  var dialog=openActionDialog(opener,"体验链接",c.title_zh), links=el("div","experience-links");
  urls.forEach(function(url,index){
    var link=externalLink(el("a","","体验链接 "+(index+1)),url);
    link.appendChild(el("small","",url));links.appendChild(link);
  });
  dialog.appendChild(links);var row=el("div","dialog-actions");
  dialogButton(row,"关闭","",function(){dialog.close()});dialog.appendChild(row);dialog.showModal();
}
function confirmDelete(c,cardEl,opener){

function b64enc(s){return btoa(unescape(encodeURIComponent(s)))}
function b64dec(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,""))))}

  api:"https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/data/favorites.json",

function showFavoriteStatus(){
  var state=favorites.status(), message;
  if(!state.persistent)message="浏览器无法保存收藏，刷新后可能丢失。";
  else if(state.syncing)message="收藏已保存，正在同步…";
  else if(state.error==="auth")message="收藏已保存在本浏览器，GitHub 同步授权不可用。";
  else if(state.error)message="收藏已保存在本浏览器，暂时无法读取或同步远端收藏。";
  else if(state.pending&&!state.authorized)message="收藏已保存在本浏览器，尚未连接 GitHub 同步。";
  else if(state.pending)message="收藏已保存在本浏览器，等待同步。";
  else if(state.authorized&&!state.loaded)message="正在检查收藏同步状态…";
  else if(state.authorized)message="收藏已同步；使用同一案例库可在其他设备查看。";
  else message="未连接 GitHub 同步，新收藏仅保存在本浏览器。";
  document.getElementById("favoriteStatus").textContent=message;
  document.getElementById("favoriteRetry").hidden=state.syncing||(!state.error&&!state.pending)||!state.authorized;
}

/* ---------- remote removed.json ---------- */
function validateRemoved(arr){if(!Array.isArray(arr))throw new Error("invalid removed list");return arr}
function fetchRemoved(){
  var h={"Accept":"application/vnd.github+json"}; var t=token(); if(t)h.Authorization="Bearer "+t;
  return fetch(API+"?ref="+BRANCH+"&t="+Date.now(),{headers:h,cache:"no-store"}).then(function(r){
    if(!r.ok)throw new Error("api "+r.status);
    return r.json().then(function(j){return validateRemoved(JSON.parse(b64dec(j.content||"")))});
  }).catch(function(){
    return fetch(RAW+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0; return r.json()}).then(validateRemoved)
  }).catch(function(){
    return fetch("data/removed.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(validateRemoved).catch(function(){return null})
  });
}
function applyRemoved(arr){
  if(!Array.isArray(arr))return;
  arr.forEach(function(x){if(x&&x.id)remote.add(x.id)});
  ls(K_SEEN,JSON.stringify(Array.from(remote)));
  var before=pending.length; pending=pending.filter(function(p){return !remote.has(p.id)}); if(pending.length!==before)savePending();
}

/* ---------- commit (GitHub Contents API) ---------- */
function commitOnce(items){
  var t=token();
  var h={"Accept":"application/vnd.github+json","Authorization":"Bearer "+t};
  return fetch(API+"?ref="+BRANCH+"&t="+Date.now(),{headers:h,cache:"no-store"}).then(function(r){
    if(r.status===404)return {sha:null,list:[]};
    if(r.status===401||r.status===403)throw {auth:true,status:r.status};
    if(!r.ok)throw {status:r.status};
    return r.json().then(function(j){var l=[];try{l=JSON.parse(b64dec(j.content||"")||"[]")}catch(e){} return {sha:j.sha,list:Array.isArray(l)?l:[]}});
  }).then(function(cur){
    var have=new Set(cur.list.map(function(x){return x.id}));
    var add=items.filter(function(p){return !have.has(p.id)});
    var list=cur.list.concat(add.map(function(p){return {id:p.id,at:p.at}}));
    if(!add.length)return list;
    var body={message:"remove: "+add.map(function(p){return p.id}).join(", "),content:b64enc(JSON.stringify(list,null,1)+"\n"),branch:BRANCH};
    if(cur.sha)body.sha=cur.sha;
    return fetch(API,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},h),body:JSON.stringify(body)}).then(function(r){
      if(r.ok)return list;
      if(r.status===409||r.status===422)throw {conflict:true,status:r.status};
      if(r.status===401||r.status===403||r.status===404)throw {auth:true,status:r.status};
      throw {status:r.status};
    });
  });
}
function flush(){
  if(flushing)return; var ready=pending.filter(function(p){return p.ready}); if(!ready.length){showSync();return}
  if(!token()){openModal("");return}
  flushing=true; showSync("同步中…");
  var tries=0;
  (function go(){
    commitOnce(ready).then(function(list){
      flushing=false; applyRemoved(list); showSync(); flush();
    },function(e){
      e=e||{};
      if(e.conflict&&tries<5){tries++; setTimeout(go,300*tries+Math.random()*300); return}
      flushing=false;
      if(e.auth){openModal("令牌无效或没有写权限（HTTP "+e.status+"），请更换。");}
      showSync();
    });
  })();
}
function showSync(msg){
  var s=document.getElementById("sync"), n=pending.filter(function(p){return p.ready}).length;
  if(msg){s.textContent=msg;s.style.display="block";return}
  if(n){s.textContent=n+" 条不感兴趣标记待同步 · 点此重试";s.style.display="block"} else s.style.display="none";
}

/* ---------- delete / undo ---------- */
var lastId=null, toastTimer=null;
function doDelete(id,cardEl){
  if(hidden(id))return;
  pending.push({id:id,at:new Date().toISOString(),ready:false}); savePending();
  cardEl.classList.add("gone"); setTimeout(function(){render()},250);
  lastId=id; toast("已标记为不感兴趣");
  timers[id]=setTimeout(function(){
    delete timers[id];
    var p=pending.find(function(x){return x.id===id}); if(p){p.ready=true; flush()}
  },UNDO_MS);
}
function undo(){
  if(!lastId)return; var id=lastId; lastId=null;
  if(timers[id]){clearTimeout(timers[id]);delete timers[id]}
  pending=pending.filter(function(p){return !(p.id===id&&!p.ready)}); savePending();
  hideToast(); render();
}
function toast(m){
  var t=document.getElementById("toast"); document.getElementById("toastMsg").textContent=m; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(hideToast,UNDO_MS);
}
function hideToast(){document.getElementById("toast").classList.remove("show")}

// Ranking uses the entire non-excluded library, never a filtered or favorite subset.
function syncGameplayOptions(visible){
  var key=visible.map(function(c){return c.id}).join("\n")+"|"+gameplayReady+"|"+gameplayLoadFailed;
  if(key===gameplayCountsKey)return;
  gameplayCountsKey=key;
  var ranked=InspoFilters.gameplayStats(visible),total=ranked.reduce(function(sum,g){return sum+g.count},0);
  var comparison=gameplayReady?gameplayTracker.compare(ranked):{hasBaseline:false,deltas:{},previousAt:null};
  [["gameplayFilter","玩法 · 全部",filterState.gameplay],["dialogGameplay","全部玩法",filterDraft?filterDraft.gameplay:filterState.gameplay]].forEach(function(item){
    var select=document.getElementById(item[0]),all=el("option","",item[1]+"（"+total+"）");
    all.value="";select.replaceChildren(all);
    ranked.forEach(function(g){
      var delta=comparison.deltas[g.value]||0;
      var label=g.label+" · "+g.count+" 个"+(comparison.hasBaseline&&delta?"（"+(delta>0?"+":"")+delta+"）":"");
      var option=el("option","",label);option.value=g.value;option.dataset.count=String(g.count);option.dataset.delta=String(delta);option.disabled=g.count===0;select.appendChild(option);
    });
    select.value=item[2];
  });
  var note="玩法排行 · 全库 "+total+" 个案例 · 数量从高到低";
  var details="按本库未排除的案例统计；搜索、行业和收藏视图不改变数量或排序。每个案例按主要玩法计数一次。";
  if(gameplayReady){
    var persisted=gameplayTracker.save(ranked);
    if(comparison.hasBaseline){
      var changed=ranked.some(function(g){return comparison.deltas[g.value]});
      var date=new Date(comparison.previousAt).toLocaleString("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
      note+=" · "+(changed?"增减见选项":"数量未变")+"（较 "+date+" 记录）";
    }else note+=" · "+(persisted?"已记录，下次可对比变化":"数量记录仅本次有效");
    if(!persisted&&comparison.hasBaseline)note+=" · 暂未保存本次记录";
    details+=" 增减对比保存在当前浏览器，首次记录不显示增长；同一访问期间基准保持不变。";
  }else note+=gameplayLoadFailed?" · 排除记录暂不可用，未记录本次数量":" · 正在核对排除记录";
  ["gameplayNote","dialogGameplayNote"].forEach(function(id){var target=document.getElementById(id);target.textContent=note;target.title=details});
}
